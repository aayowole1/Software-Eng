{% extends "base.html" %}
{% block title %}Apply to join{% endblock %}
{% block content %}
  <h1>Apply to join</h1>
  <p>Google confirmed your email: <strong>{{ email }}</strong></p>
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit application</button>
  </form>
  <p class="muted">You can sign in with Google once an officer approves your application.</p>
{% endblock %}
