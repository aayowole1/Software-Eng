{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
  <h1>Set a new password</h1>
  {% if validlink %}
    <form method="post" class="card" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Set password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or has already been used. <a href="{% url 'accounts:password_reset' %}">Request a new one</a>.</p>
  {% endif %}
{% endblock %}
