{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
  <p><a href="{% url 'accounts:profile' %}">Back to My account</a></p>
  <h1>Edit profile</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save profile</button>
  </form>
{% endblock %}
