{% extends "base.html" %}
{% block title %}Delete {{ kind }}{% endblock %}
{% block page_heading %}Delete {{ kind }}{% endblock %}
{% block content %}
<h1>Delete {{ kind }}</h1>
<p>Remove “{{ object }}”? It will no longer be available to members.</p>

{% endblock %}
