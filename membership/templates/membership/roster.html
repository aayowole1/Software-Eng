{% extends "base.html" %}
{% block title %}Roster{% endblock %}
{% block content %}
  <h1>Member roster</h1>
  <div class="table-wrap">
    <table>
      <thead><tr><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Member since</th></tr></thead>
      <tbody>
        {% for p in members %}
          <tr><td>{{ p.user.email|default:p.user.username }}</td><td>{{ p.get_role_display }}</td><td>{{ p.created_at|date:"M j, Y" }}</td></tr>
        {% empty %}
          <tr><td colspan="3" class="muted">No members yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
