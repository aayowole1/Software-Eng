{% extends "base.html" %}
{% load static %}
{% block title %}Processing notes{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'meetings/style.css' %}">
{% endblock %}
{% block content %}
  <main class="meeting-processing-page" aria-live="polite">
    <div class="meeting-processing-card">
      <div class="meeting-spinner" aria-hidden="true"></div>
      <h1>Processing notes</h1>
      <p>Transcribing audio and preparing the notes summary and action items.</p>
    </div>
  </main>
  <form id="processing-form" method="post" action="{% url 'meetings:process' %}">
    {% csrf_token %}
  </form>
  <script>
    fetch("{% url 'meetings:process' %}?submission_id={{ submission_id|urlencode }}", {
      method: "POST",
      headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
    })
      .then(async (response) => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Notes processing failed.");
        window.location.assign(data.redirect);
      })
      .catch((error) => {
        document.querySelector(".meeting-processing-card").innerHTML =
          `<h1>Notes processing failed</h1><p class="notes-submit-warning">${error.message}</p>` +
          '<p><a class="button" href="{% url "meetings:create" %}">Return to notes</a></p>';
      });
  </script>
{% endblock %}
