{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <h1>{{ heading }}</h1>
  <form method="post" class="card" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <p class="muted">The AI will draft a summary and proposed action items. Nothing is saved as a task until an officer approves it.</p>
    <button type="submit">Generate draft</button>
  </form>
{% endblock %}
